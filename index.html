<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playlist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="clock">
      <span class="clock-h"></span><span class="clock-colon">:</span
      ><span class="clock-m"></span>
      <span class="clock-ap"></span>
    </div>
    <a
      class="spotify"
      href="https://open.spotify.com/playlist/1Vm7j8I8FCvXhmBJuS3BQj"
      target="_blank"
      rel="noopener"
    >
      <svg class="spotify-logo" viewBox="0 0 496 512" aria-hidden="true">
        <path
          fill="currentColor"
          d="M248 8C111.1 8 0 119.1 0 256s111.1 248 248 248 248-111.1 248-248S384.9 8 248 8zm100.7 364.9c-4.2 0-6.8-1.3-10.7-3.6-62.4-37.6-135-39.2-206.7-24.5-3.9 1-9 2.6-11.9 2.6-9.7 0-15.8-7.7-15.8-15.8 0-10.3 6.1-15.2 13.6-16.8 81.9-18.1 165.6-16.5 237 26.2 6.1 3.9 9.7 7.4 9.7 16.5s-7.1 15.4-15.2 15.4zm26.9-65.6c-5.2 0-8.7-2.3-12.3-4.2-62.5-37-155.7-51.9-238.6-29.4-4.8 1.3-7.4 2.6-11.9 2.6-10.7 0-19.4-8.7-19.4-19.4s5.2-17.8 15.5-20.7c27.8-7.8 56.2-13.6 97.8-13.6 64.9 0 127.6 16.1 177 45.5 8.1 4.8 11.3 11 11.3 19.7-.1 10.8-8.5 19.5-19.4 19.5zm31-76.2c-5.2 0-8.4-1.3-12.9-3.9-71.2-42.5-198.5-52.7-280.9-29.7-3.6 1-8.1 2.6-12.9 2.6-13.2 0-23.3-10.3-23.3-23.6 0-13.6 8.4-21.3 17.4-23.9 35.2-10.3 74.6-15.2 117.5-15.2 73 0 149.5 15.2 205.4 47.8 7.8 4.5 12.9 10.7 12.9 22.6 0 13.6-11 23.3-23.2 23.3z"
        />
      </svg>
      <span>Spotify</span>
      <svg
        class="spotify-arrow"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M6 18 L18 6 M8 6 h10 v10" />
      </svg>
    </a>
    <div class="player">
      <img class="player-art" alt="" />
      <div class="player-meta">
        <div class="player-title">—</div>
        <div class="player-artist">—</div>
        <div class="player-seek">
          <span class="player-t-cur">0:00</span>
          <input class="player-bar" type="range" min="0" max="1000" value="0" />
          <span class="player-t-dur">0:30</span>
        </div>
      </div>
      <div class="player-controls">
        <button class="pc-btn pc-prev" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 5h2.5v14H6zM20 5v14L9.5 12z" />
          </svg>
        </button>
        <button class="pc-btn pc-play" aria-label="Play">
          <svg class="ic-play" viewBox="0 0 24 24">
            <path d="M7 4.5v15L20 12z" />
          </svg>
          <svg class="ic-pause" viewBox="0 0 24 24">
            <path d="M6.5 4h3.8v16H6.5zM13.7 4h3.8v16h-3.8z" />
          </svg>
        </button>
        <button class="pc-btn pc-next" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.5 5H18v14h-2.5zM4 5v14l10.5-7z" />
          </svg>
        </button>
        <button class="pc-btn pc-shuffle" aria-label="Shuffle">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"
            />
          </svg>
        </button>
      </div>
    </div>
    <script src="tracks.js"></script>
    <script src="script.js"></script>
  </body>
</html>
